<div class="chat-wrapper">
  <!-- Header -->
  <div class="chat-header">
    <div class="chat-header-left">
      <div class="bot-avatar">🤖</div>
      <div>
        <div class="bot-name">FinBot</div>
        <div class="bot-status"><span class="dot"></span> En línea</div>
      </div>
    </div>
    <div class="chat-header-actions">
      <button class="btn btn-secondary" id="btn-reset-chat" (click)="resetChat()" title="Reiniciar conversación">
        🔄
      </button>
      <button class="btn btn-primary" id="btn-download-excel" (click)="downloadExcel()" [disabled]="!excelReady">
        <span>⬇️</span> Descargar Excel
      </button>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" #chatContainer>
    <div *ngFor="let msg of messages; trackBy: trackByMessage" class="msg-row" [class.msg-user]="msg.sender === 'user'"
      [class.msg-bot]="msg.sender === 'bot'">

      <div class="msg-avatar" *ngIf="msg.sender === 'bot'">🤖</div>

      <div class="msg-content">
        <div class="msg-bubble" [class.bubble-user]="msg.sender === 'user'" [class.bubble-bot]="msg.sender === 'bot'">
          {{ msg.text }}
        </div>

        <!-- Transaction chips detected -->
        <div class="tx-chips" *ngIf="msg.transactions && msg.transactions.length">
          <div class="tx-chip" *ngFor="let tx of msg.transactions; trackBy: trackByTransaction"
            [class.chip-income]="tx.tipo === 'ingreso'" [class.chip-expense]="tx.tipo === 'gasto'">
            <span class="chip-icon">{{ tx.tipo === 'ingreso' ? '📈' : '📉' }}</span>
            <span class="chip-concept">{{ tx.concepto }}</span>
            <span class="chip-amount">${{ tx.monto | number:'1.2-2' }}</span>
            <span class="chip-cat">{{ tx.categoria }}</span>
          </div>
        </div>

        <div class="msg-time">{{ msg.time }}</div>
      </div>

      <div class="msg-avatar" *ngIf="msg.sender === 'user'">👤</div>
    </div>

    <!-- Typing indicator -->
    <div class="msg-row msg-bot" *ngIf="loading">
      <div class="msg-avatar">🤖</div>
      <div class="msg-bubble bubble-bot typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-area">
    <input id="chat-input" class="input-field chat-input" type="text" [(ngModel)]="userInput"
      (keyup.enter)="sendMessage()" placeholder='Ej: "Gasté $300 en transporte" o "Gané $12,000 de sueldo"'
      [disabled]="loading" />
    <button class="btn btn-primary send-btn" id="btn-send-msg" (click)="sendMessage()"
      [disabled]="loading || !userInput.trim()">
      <span *ngIf="!loading">➤</span>
      <span class="spinner" *ngIf="loading"></span>
    </button>
  </div>
</div>
